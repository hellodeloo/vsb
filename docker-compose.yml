services:
  wordpress:
    image: wordpress:php8.4-apache
    container_name: vsb-wordpress
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: "db:3306"
      WORDPRESS_DB_NAME: "${MYSQL_DATABASE:-wordpress_local}"
      WORDPRESS_DB_USER: "${MYSQL_USER:-wp_user}"
      WORDPRESS_DB_PASSWORD: "${MYSQL_PASSWORD:-wp_password}"
    volumes:
      - ./:/var/www/html
    restart: unless-stopped

  db:
    image: mysql:8.4
    container_name: vsb-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default_table_encryption=OFF
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:-wordpress_local}"
      MYSQL_USER: "${MYSQL_USER:-wp_user}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-wp_password}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root_password_change_me}"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_password_change_me}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: vsb-phpmyadmin
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 256M
    restart: unless-stopped

volumes:
  db_data:
